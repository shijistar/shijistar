name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the master branch
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from current github user contributions graph, output a svg animation at dist/
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Adjust animation speed
      - name: tune animation speed
        run: |
          python3 - <<'EOF'
          import re, glob

          SPEED = 0.5   # the speed coefficient

          for path in glob.glob("dist/*.svg"):
              with open(path) as f:
                  s = f.read()
              s = re.sub(r"(\d+)ms", lambda m: f"{int(round(int(m.group(1)) / SPEED))}ms", s)
              with open(path, "w") as f:
                  f.write(s)
          EOF

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
