<svg xmlns="http://www.w3.org/2000/svg" width="800" height="194" viewBox="0 0 800 194">
  <style>
    .corner { animation: cornerPulse 10s ease-in-out infinite; }
    .frame { animation: framePulse 10s ease-in-out infinite; }
    .status-dot { animation: statusPulse 10s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .scan { animation: scanDrift 10s linear infinite; }

    @keyframes cornerPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes framePulse {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.6; }
    }
    @keyframes statusPulse {
      0%, 70%, 100% { opacity: 1; transform: scale(1); }
      80% { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes scanDrift {
      from { transform: translateY(0); }
      to { transform: translateY(8px); }
    }
  </style>
  <defs>
    <linearGradient id="light-skills-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="scan-skills" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#2563eb" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#light-skills-bg)" rx="14" ry="14"/>

  <g class="frame">
    <rect x="48" y="28" width="704" height="144" rx="6" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 6"/>
  </g>
  <g class="corner">
    <g transform="translate(48 28) scale(1 1)">
    <rect x="0" y="0" width="14" height="2" fill="#2563eb" filter="drop-shadow(0 0 4px #2563eb)"/>
    <rect x="0" y="0" width="2" height="14" fill="#2563eb" filter="drop-shadow(0 0 4px #2563eb)"/>
  </g>
  <g transform="translate(752 28) scale(-1 1)">
    <rect x="0" y="0" width="14" height="2" fill="#2563eb" filter="drop-shadow(0 0 4px #2563eb)"/>
