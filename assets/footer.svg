    .b31 {
      animation: barPulse 10s ease-in-out infinite;
      animation-delay: -1.59s;
    }

    @keyframes barPulse {

      0%,
      100% {
        transform: scaleY(0.4);
        transform-box: fill-box;
        transform-origin: bottom;
      }

      50% {
        transform: scaleY(1.4);
        transform-box: fill-box;
        transform-origin: bottom;
      }
    }

    @keyframes streamFlash {

      0%,
      100% {
        stroke-opacity: 0.5;
      }

      50% {
        stroke-opacity: 0.9;
      }
    }

    @keyframes statusPulse {

      0%,
      70%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      80% {
        opacity: 0.4;
        transform: scale(0.7);
      }
    }

    @keyframes scanDrift {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(8px);
      }
    }
  </style>
  <defs>
    <linearGradient id="neon-foot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2990ff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#0a0118" />
      <stop offset="100%" stop-color="#0a0118" />
    </linearGradient>
    <pattern id="scan-foot" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.025" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#neon-foot-bg)" rx="14" ry="14" />

  <!-- Top hairline divider, glowing -->
  <line class="stream-line" x1="40" y1="6" x2="760" y2="6" stroke="#2990ff" stroke-width="1" stroke-opacity="0.6" filter="drop-shadow(0 0 4px #2990ff)" />

  <!-- Header strip: status pill on left, frame counter on right -->
  <g class="header-pill" transform="translate(40 22)">
    <rect x="-8" y="-12" width="118" height="20" rx="4" fill="#0a0118" stroke="#22e8ec" stroke-width="1" stroke-opacity="0.6" />
    <circle class="status-dot" cx="2" cy="-2" r="2.5" fill="#22e8ec" filter="drop-shadow(0 0 3px #22e8ec)" />
    <text x="12" y="2" fill="#22e8ec" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">CONNECTED</text>
  </g>

  <!-- Big "// END_TRANSMISSION" header -->
  <text class="tx" x="400" y="65" text-anchor="middle" fill="#fde7ff" font-family="ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="2" filter="drop-shadow(0 0 6px #2990ff)">// END_TRANSMISSION</text>

  <!-- Tagline / sign-off subline -->
  <text class="tag-line" x="400" y="93" text-anchor="middle" fill="#22e8ec" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">Pursue excellence, and success will follow!</text>

  <!-- Socials row, alternating cyan/magenta -->
  <g transform="translate(318 113)" class="soc sf0">
    <g transform="translate(0 -7)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2990ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
        <path d="M9 18c-4.51 2-5-2-7-2" />
      </svg></g>
    <text x="20" y="0" fill="#2990ff" font-family="ui-monospace, monospace" font-size="12" dominant-baseline="middle" letter-spacing="0.5">github.com/shijistar</text>
  </g>

